<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E9E9EB">
<title>کنسول کلاود ایران | ClaudeIran Console — UI Concept</title>
<meta name="description" content="پیش‌نمایش تعاملی کنسول کلاود ایران با داده نمونه: پروژه‌ها، کلیدها، بودجه و گزارش درخواست‌ها. مبالغ نمایشی‌اند و قیمت واقعی نیستند؛ قیمت‌ها هنوز اعلام نشده‌اند.">
<!-- product preview with sample data: kept out of the index so sample amounts are never quoted as prices -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://claudeiran.com/console.html">
<link rel="preload" href="/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Manrope-wght.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ClaudeIran Console — Keel dashboard language. Only palette change: Primary -> Terracotta #D97757 */
@font-face{font-family:"Manrope";src:url("/fonts/Manrope-wght.woff2") format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Vazirmatn";src:url("/fonts/Vazirmatn-wght.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
 --primary:#D97757; --primary-deep:#C15F3C; --secondary:#6B6F78; --ink:#181C25; --white:#FFFFFF;
 --canvas:#E9E9EB; --screen:#EEEEF0; --card:#F5F5F7; --card-2:#FAFAFB; --line:#E2E2E6; --line-2:#D9D9DE;
 --tail:#8A8D95; --text-2:#4F535D; --on-dark-2:#A9ADB6; --dark-line:#2B303B; --dark-2:#222733;
 --p-16:rgba(217,119,87,.16); --p-30:rgba(217,119,87,.30); --p-45:rgba(217,119,87,.45);
 /* Keel's semantic "down" badge (not the brand colour) */
 --down:#B4232A; --down-bg:#FBE3E4;
 --fs-xs:12px; --fs-sm:14px; --fs-base:15px; --fs-md:18px; --fs-lg:28px; --fs-xl:clamp(44px,5.6vw,80px);
 --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px; --r-pill:999px;
 --shadow:0 40px 90px -30px rgba(24,28,37,.22),0 12px 30px -16px rgba(24,28,37,.10);
 --shadow-soft:0 18px 50px -26px rgba(24,28,37,.18);
 --font:"Manrope","Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif; --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:8px}
.dark :focus-visible{outline-color:#fff}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flip{transform:scaleX(-1)}
[dir=ltr] .flip{transform:none}
.num,.en,code{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:300;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{top:10px}

/* ===== shell ===== */
.app{max-width:1400px;margin:0 auto;padding:16px}
.screen{background:var(--screen);border-radius:30px;padding:20px 24px 28px;min-height:calc(100vh - 32px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:var(--fs-md);white-space:nowrap}
.brand svg{width:28px;height:28px}
.managers{display:flex;align-items:center;gap:10px;margin-inline-start:18px}
.avatars{display:flex;direction:ltr}
.avatars span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;background:#D3D4D9;color:var(--ink);border:2px solid var(--screen);margin-left:-8px}
.avatars span:first-child{margin-left:0}
.avatars span:nth-child(2){background:#BFC1C7}
.avatars span:nth-child(3){background:#A9ADB6}
.avatars span:last-child{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid transparent;font-size:var(--fs-sm);font-weight:650;white-space:nowrap;background:var(--white);transition:background .2s,transform .2s}
.btn .ico{width:16px;height:16px}
.btn:hover{background:var(--card)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#2A303D}
.btn-line{background:transparent;border-color:var(--line-2)}
.btn-line:hover{background:var(--white)}
.btn-primary{background:var(--primary);color:var(--ink)}
.btn-primary:hover{background:var(--primary);box-shadow:inset 0 -2px 0 var(--primary-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.demo-pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.7);border:1px solid var(--line-2);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none;display:inline-block}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--white);border:0;display:grid;place-items:center;position:relative}
.icon-btn.bell.has::after{content:"";position:absolute;top:10px;inset-inline-end:11px;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px #fff}
.me{width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;background:var(--white);border:0;font-size:var(--fs-sm);font-weight:600;color:var(--text-2);white-space:nowrap}
.tab .ico{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab .count{font-size:var(--fs-xs);background:var(--p-16);color:var(--ink);border-radius:var(--r-pill);padding:0 7px;line-height:20px}
.tab[aria-selected="true"] .count{background:var(--primary);color:var(--ink)}

/* ===== page head ===== */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:30px 0 18px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:700;color:var(--text-2);letter-spacing:.12em}
.head h1{margin:6px 0 0;font-size:var(--fs-lg);font-weight:500;line-height:1.35}
.head p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--text-2)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== cards / tiles ===== */
.card{background:var(--card-2);border-radius:var(--r-lg);padding:20px;min-width:0}
.card-w{background:var(--white)}
.card h2{margin:0;font-size:var(--fs-md);font-weight:600;line-height:1.5}
.card .sub{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.grid-main{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.stack{display:grid;gap:12px;align-content:start}
.figure{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 4px 14px}
.figure .label{font-size:var(--fs-sm);font-weight:500}
.figure .big{font-family:"Manrope",sans-serif;font-size:var(--fs-xl);font-weight:400;letter-spacing:-.05em;line-height:1;margin-top:10px}
.figure .big .tail{color:var(--tail)}
.figure .unit{font-size:var(--fs-xs);color:var(--secondary);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--card-2);border-radius:var(--r-md);padding:14px 15px 12px;min-width:0}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile b{font-family:"Manrope",sans-serif;font-size:var(--fs-lg);font-weight:450;letter-spacing:-.03em;line-height:1.2}
.tile small{display:block;font-size:var(--fs-xs);color:var(--secondary);margin-top:4px;line-height:1.6}
.bd{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;white-space:nowrap;direction:ltr}
.bd.up{background:var(--p-16);color:var(--ink)}
.bd.down{background:var(--down-bg);color:var(--down)}
.bd.flat{background:#E4E4E8;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:650;white-space:nowrap;background:#E4E4E8}
.pill.p{background:var(--primary);color:var(--ink)}
.pill.soft{background:var(--p-16)}
.pill.w{background:var(--white);border:1px solid var(--line)}
.pill.dk{background:var(--ink);color:#fff}

/* bar field */
.barfield{height:170px;display:flex;align-items:flex-end;gap:2px;direction:ltr;margin-top:14px;position:relative}
.barfield i{flex:1;min-width:1px;background:#C3C5CB;border-radius:1px;height:var(--h)}
.barfield i.hi{background:var(--primary)}
.marker{position:absolute;bottom:calc(var(--y) + 10px);left:var(--x);transform:translateX(-50%);background:var(--white);box-shadow:0 8px 20px -8px rgba(24,28,37,.3);border-radius:10px;padding:4px 9px;font-size:var(--fs-xs);line-height:1.4;text-align:center;white-space:nowrap;direction:rtl}
.marker b{display:block;font-family:"Manrope",sans-serif;font-weight:600;direction:ltr}
.marker.hl{background:var(--primary)}
.axis{display:flex;justify-content:space-between;direction:ltr;margin-top:10px;gap:4px}
.axis span{font-size:var(--fs-xs);font-weight:600;min-width:28px;height:24px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);background:#DADBE0}
.axis span.hi{background:var(--primary)}
/* stepped bars + gauge */
.steps{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:14px;direction:ltr}
.steps button{flex:1;display:block;min-width:0;border:0;padding:0;border-radius:4px 4px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));border-top:3px solid var(--white);position:relative;cursor:pointer;transition:height .5s var(--spring,ease),filter .2s,border-color .2s}
.steps button:hover{filter:brightness(1.04) saturate(1.25)}
.steps button.hi{background:linear-gradient(180deg,var(--p-45),rgba(217,119,87,0));border-top-color:var(--primary)}
.steps button.lo{border-top:3px dashed #B9BBC2;background:linear-gradient(180deg,rgba(230,230,234,.9),rgba(230,230,234,0))}
.steps button[aria-pressed="true"]{border-top-color:var(--ink)}
.steps button .pill{position:absolute;top:-15px;left:50%;transform:translateX(-50%);height:24px}
.legend{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:var(--fs-xs);color:var(--secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%;background:#C9CAD0;display:inline-block}
.legend i.p{background:var(--primary)}
.mini .big{font-family:"Manrope",sans-serif;font-size:36px;font-weight:400;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.gauge{background:var(--ink);color:#fff}
.gauge .sub,.gauge .legend{color:var(--on-dark-2)}
.gauge .legend i{background:#4A505D}
.gauge svg{width:100%;max-width:220px;margin:12px auto 0}
/* terracotta gradient alert card (Keel "34 days") */
.cap{border-radius:var(--r-lg);padding:20px;background:linear-gradient(180deg,var(--card-2) 0%,var(--card-2) 24%,#F3D9CF 76%,#EDC4B5 100%);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:330px}
.cap .art{position:absolute;top:18px;inset-inline-end:18px;width:72px;height:72px;color:rgba(24,28,37,.10)}
.cap .big{font-family:"Manrope",sans-serif;font-size:72px;font-weight:300;line-height:1;margin-top:auto;letter-spacing:-.05em}
.cap .big small{font-size:var(--fs-md);font-weight:500;letter-spacing:0;margin-inline-start:8px}
.progress{height:8px;background:rgba(255,255,255,.75);border-radius:var(--r-pill);overflow:hidden;margin:16px 0 8px;direction:ltr}
.progress span{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .4s var(--ease)}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs)}
.cap p{margin:12px 0 0;font-size:var(--fs-sm);line-height:1.85}
/* alerts panel */
.alerts{background:var(--white);border-radius:var(--r-lg);padding:18px 18px 12px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.itile{width:44px;height:44px;border-radius:13px;background:var(--card);display:grid;place-items:center}
.itile .ico{width:20px;height:20px}
.arow h3{margin:0;font-size:var(--fs-sm);font-weight:600;line-height:1.55}
.arow p{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary);line-height:1.6}
.arow .when{font-size:var(--fs-xs);color:var(--secondary);align-self:start;padding-top:2px;white-space:nowrap}
.arow.focus{background:var(--card);border-radius:18px;border-bottom:0;margin:6px 0;padding:14px 12px}
.arow.focus .itile{background:var(--white)}
.arow .acts{grid-column:2 / -1;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;margin-inline-start:8px;vertical-align:middle}
.dark-foot{margin-top:12px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dark-foot span{font-size:var(--fs-xs);color:var(--on-dark-2)}
.dark-foot strong{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.dark-foot .ico{color:var(--primary);stroke-width:2.4}
.note-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note-card .l{display:flex;gap:14px;align-items:center}
.note-card h2{font-size:var(--fs-sm)}
.note-card p{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}

/* ===== Keel table ===== */
.tbl-card{background:var(--white);border-radius:var(--r-lg);padding:18px 20px 14px;margin-top:12px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.tools .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--card);min-width:240px}
.search input{border:0;background:transparent;outline:0;font-size:var(--fs-sm);width:100%}
.search:focus-within{box-shadow:0 0 0 2.5px var(--ink)}
.fpills{display:flex;gap:4px;background:var(--card);border-radius:var(--r-pill);padding:4px}
.fpills button{border:0;background:transparent;min-height:36px;padding:0 13px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:650;color:var(--text-2)}
.fpills button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(24,28,37,.1)}
.twrap{overflow-x:auto}
.kt{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.kt th{font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;color:var(--secondary);text-align:start;padding:12px 8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.kt th.n,.kt td.n{text-align:end}
.kt th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:28px;border-radius:6px}
.kt th button:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.kt th .ar{display:inline-grid;line-height:.55;font-size:10px;color:#B9BBC2}
.kt th[aria-sort="ascending"] .ar .u,.kt th[aria-sort="descending"] .ar .d{color:var(--ink)}
.kt td{padding:14px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.kt tbody tr{transition:background .15s}
.kt tbody tr:hover{background:var(--card-2)}
.kt tbody tr:last-child td{border-bottom:0}
.kt .pc{font-weight:600}
.kt .dim{color:var(--secondary)}
.kt .id{font-family:"Manrope",sans-serif;color:var(--secondary);direction:ltr;unicode-bidi:isolate}
[dir=rtl] .kt div.id{text-align:right}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.st i{width:7px;height:7px;border-radius:50%;background:var(--primary);display:inline-block}
.st.off i{background:#B9BBC2}
.st.bad{color:var(--down)} .st.bad i{background:var(--down)}
.rowbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;background:var(--card);font-size:var(--fs-xs);font-weight:650}
.rowbtn:hover{background:#ECECEF}
.rowbtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.rowbtn[disabled]{opacity:.45;cursor:not-allowed}
.amt.plus{color:var(--ink);font-weight:650}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.fnote{font-size:var(--fs-xs);color:var(--secondary);margin:0;line-height:1.7}
.pager{display:flex;gap:4px;align-items:center;direction:ltr}
.pager button{min-width:36px;height:36px;border-radius:var(--r-pill);border:0;background:var(--card);font-size:var(--fs-xs);font-weight:700;font-family:"Manrope",sans-serif}
.pager button[aria-current="page"]{background:var(--ink);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pcount{font-size:var(--fs-xs);color:var(--secondary)}
/* states */
.state{padding:40px 16px;text-align:center}
.state .itile{margin:0 auto 12px}
.state h3{margin:0;font-size:var(--fs-sm);font-weight:650}
.state p{margin:4px 0 14px;font-size:var(--fs-xs);color:var(--secondary)}
.state.err .itile{background:var(--down-bg);color:var(--down)}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#EDEDF0 0%,#F7F7F9 40%,#EDEDF0 80%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(24,28,37,.42);backdrop-filter:blur(3px);border:0}
.dialog{position:relative;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px}
.dialog .x{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:13px;border:0;background:var(--card);display:grid;place-items:center}
.dialog h2{margin:0;font-size:var(--fs-md);font-weight:650;padding-inline-end:52px}
.dialog .sub{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-size:var(--fs-xs);font-weight:650}
.field input,.field select{height:48px;border-radius:13px;border:1px solid var(--line-2);background:var(--card-2);padding:0 14px;font-size:var(--fs-sm);width:100%}
.field input:focus,.field select:focus{outline:2.5px solid var(--ink);outline-offset:1px}
.field .hint{font-size:var(--fs-xs);color:var(--secondary)}
.f-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:22px;flex-wrap:wrap}
.keybox{margin-top:16px;background:var(--card);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.keybox code{flex:1;font:600 14px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;word-break:break-all}
.warn{margin-top:12px;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#FBEEE9,#F6DCD2);font-size:var(--fs-sm);line-height:1.8;display:flex;gap:10px}
.warn .ico{margin-top:4px}

/* toast */
.toast{position:fixed;z-index:250;bottom:20px;inset-inline-start:50%;transform:translate(50%,140%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:var(--fs-sm);box-shadow:var(--shadow);transition:transform .3s var(--ease),visibility .3s;max-width:calc(100% - 32px);visibility:hidden}
[dir=ltr] .toast{transform:translate(-50%,140%)}
.toast.on{transform:translate(50%,0);visibility:visible}
[dir=ltr] .toast.on{transform:translate(-50%,0)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--text-2);padding:16px 8px 4px}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row strong{font-size:var(--fs-sm);font-weight:600}
.set-row p{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.switch{width:46px;height:28px;border-radius:var(--r-pill);border:0;background:#C9CAD0;position:relative;flex:none;transition:background .2s}
.switch::before{content:"";position:absolute;inset:-8px -2px}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch[aria-checked="true"]{background:var(--primary)}
[dir=rtl] .switch[aria-checked="true"]::after{transform:translateX(-18px)}
[dir=ltr] .switch[aria-checked="true"]::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--ink);height:44px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1100px){
 .grid-main{grid-template-columns:1fr}
 .managers .btn span{display:none}
}
@media (max-width:760px){
 :root{--fs-base:14px;--fs-lg:24px}
 .app{padding:8px}
 .screen{border-radius:22px;padding:14px 12px 18px}
 .managers{margin-inline-start:auto}
 .managers .btn{display:none}
 .top-end{width:100%;margin:0;justify-content:space-between}
 .demo-pill{flex:1;justify-content:center}
 .tiles{grid-template-columns:1fr 1fr}
 .tiles.t3{grid-template-columns:1fr 1fr 1fr}
 .tiles.t3 .tile{padding:12px 10px}
 .tiles.t3 .tile b{font-size:20px}
 .head{margin:22px 0 14px;align-items:flex-start}
 .head-actions,.head-actions .btn{width:100%}
 .card{padding:16px}
 .figure .big{font-size:56px}
 .barfield{height:120px;gap:1px}
 .marker{display:none}
 .axis span,.axis button{min-width:0;padding:0 6px}
 .split2{grid-template-columns:1fr!important}
 .search{min-width:0;width:100%}
 .tools .l{width:100%}
 .fpills{overflow-x:auto;max-width:100%}
 .tbl-card{padding:14px 12px 12px}
 /* table -> cards */
 .kt thead{display:none}
 .kt,.kt tbody{display:block}
 .kt tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
 .kt tbody tr:last-child{border-bottom:0}
 .kt td{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border:0;white-space:normal;grid-column:1 / -1;font-size:var(--fs-sm)}
 .kt td::before{content:attr(data-l);font-size:var(--fs-xs);color:var(--secondary);font-weight:600}
 .kt td.n{text-align:start}
 .kt td:first-child{grid-column:1;font-weight:650;display:block}
 .kt td:first-child::before{display:none}
 .kt td.lead2{grid-column:2;grid-row:1;justify-content:flex-end}
 .kt td.lead2::before{display:none}
 .kt td.act::before{display:none}
 .kt td.act{justify-content:flex-start;margin-top:4px}
 .cap{min-height:280px}
 .cap .big{font-size:60px}
 .dialog{padding:18px;border-radius:24px}
 .modal{padding:10px;align-items:flex-end}
 .arow{grid-template-columns:40px 1fr;gap:12px}
 .itile{width:40px;height:40px}
 .arow .when,.arow>.pill{grid-column:2;justify-self:start}
 .arow .acts{grid-column:2}
}

/* ===== Glass layer (2026-11-23): Apple-style frosted surfaces over an ambient wallpaper. Overrides the Keel base above; the previous look is in docs/console-v1-backup.html ===== */
:root{
 --glass:rgba(255,255,255,.5); --glass-hi:rgba(255,255,255,.74); --glass-lo:rgba(255,255,255,.32); --glass-line:rgba(255,255,255,.72);
 --chrome:rgba(255,255,255,.64); --chrome-dk:rgba(28,30,38,.8); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
 --blur:saturate(180%) blur(24px); --blur-lg:saturate(190%) blur(40px);
 --line:rgba(24,28,37,.08); --line-2:rgba(24,28,37,.13); --card:rgba(255,255,255,.62); --card-2:rgba(255,255,255,.45);
 --secondary:#5B5F68; --text-2:#474B55; --spring:cubic-bezier(.34,1.4,.64,1);
 --lift:0 1px 1px rgba(24,28,37,.03),0 18px 40px -26px rgba(70,44,30,.32),inset 0 1px 0 rgba(255,255,255,.9);
}
html.solid{--glass:#F6F4F2;--glass-hi:#FFFFFF;--glass-lo:#EFECE9;--chrome:#FBFAF9;--chrome-dk:#23262F;--blur:none;--blur-lg:none}
@media (prefers-reduced-transparency:reduce){:root{--glass:#F6F4F2;--glass-hi:#FFFFFF;--glass-lo:#EFECE9;--chrome:#FBFAF9;--chrome-dk:#23262F;--blur:none;--blur-lg:none}}
body{background:#EEE9E5}
/* wallpaper: soft colour fields, no filters (cheap to paint) */
.wall{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(100% 70% at 100% 0%,#F7E1D5 0%,rgba(247,225,213,0) 60%),radial-gradient(80% 70% at 0% 100%,#DDE3F4 0%,rgba(221,227,244,0) 65%),linear-gradient(165deg,#F3EEEA 0%,#E9E6EE 100%)}
.wall i{position:absolute;border-radius:50%;animation:drift 28s var(--ease) infinite alternate}
.wall i:nth-child(1){width:60vmax;height:60vmax;top:-22vmax;right:-18vmax;background:radial-gradient(closest-side,rgba(226,140,108,.55),rgba(226,140,108,0))}
.wall i:nth-child(2){width:55vmax;height:55vmax;bottom:-24vmax;left:-16vmax;background:radial-gradient(closest-side,rgba(150,170,235,.5),rgba(150,170,235,0));animation-duration:34s}
.wall i:nth-child(3){width:40vmax;height:40vmax;top:30%;left:35%;background:radial-gradient(closest-side,rgba(244,200,150,.42),rgba(244,200,150,0));animation-duration:40s}
@keyframes drift{to{transform:translate3d(-5vmax,4vmax,0) scale(1.1)}}

/* window */
.app{padding:20px;transition:transform .6s var(--ease),opacity .45s var(--ease);transform-origin:50% 0}
.app.min{transform:translateY(62vh) scale(.1);opacity:0;pointer-events:none}
.screen{position:relative;background:var(--glass-lo);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);border:1px solid var(--glass-line);border-radius:32px;padding:10px 24px 26px;box-shadow:0 60px 120px -50px rgba(70,44,30,.42),0 20px 50px -30px rgba(24,28,37,.2),inset 0 1px 0 rgba(255,255,255,.85)}
.titlebar{position:relative;display:flex;align-items:center;height:34px;direction:ltr;margin:0 -10px 4px}
.lights{display:flex}
.lights>*{position:relative;width:22px;height:22px;border:0;padding:0;background:none;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.lights>*::before{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights .r{--c:#FF5F57}.lights .y{--c:#FEBC2E}.lights .g{--c:#28C840}
.lights svg{position:relative;width:8px;height:8px;fill:none;stroke:rgba(0,0,0,.6);stroke-width:1.5;stroke-linecap:round;opacity:0;transition:opacity .15s}
.lights:hover svg,.lights :focus-visible svg{opacity:1}
.lights :focus-visible{outline-offset:0;border-radius:50%}
.wtitle{position:absolute;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:650;color:var(--secondary);pointer-events:none;white-space:nowrap}

/* controls */
.btn{border-radius:var(--r-pill);background:var(--glass-hi);border-color:var(--glass-line);box-shadow:0 1px 2px rgba(24,28,37,.06),inset 0 1px 0 rgba(255,255,255,.9);transition:background .2s,box-shadow .2s,transform .3s var(--spring)}
.btn:hover{background:#fff}
.btn:active{transform:scale(.96)}
.btn:disabled{transform:none}
.btn-dark{background:rgba(24,28,37,.9);border-color:rgba(24,28,37,.9);color:#fff;box-shadow:0 10px 24px -12px rgba(24,28,37,.7),inset 0 1px 0 rgba(255,255,255,.16)}
.btn-dark:hover{background:var(--ink)}
.btn-line{background:var(--glass-lo);border-color:var(--line-2);box-shadow:none}
.btn-line:hover{background:var(--glass-hi)}
.icon-btn,.me{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass-hi);box-shadow:0 1px 2px rgba(24,28,37,.06),inset 0 1px 0 #fff;transition:background .2s,transform .3s var(--spring),box-shadow .2s}
.icon-btn:hover{background:#fff}
.me{background:var(--ink);border-color:var(--ink);color:#fff;cursor:pointer;font-family:inherit}
.icon-btn:active,.me:active,.avatars:active{transform:scale(.92)}
.icon-btn.bell.has::after{top:9px;inset-inline-end:10px}
.icon-btn[aria-expanded="true"],.me[aria-expanded="true"],.avatars[aria-expanded="true"]{box-shadow:0 0 0 3px var(--p-30)}
.demo-pill{background:var(--glass);border-color:var(--glass-line);cursor:pointer;min-height:44px;min-width:0;transition:background .2s}
.demo-pill:hover{background:var(--glass-hi)}
.avatars{border:0;background:none;padding:4px;border-radius:var(--r-pill);cursor:pointer;transition:transform .3s var(--spring),box-shadow .2s}
.avatars span{border-color:rgba(255,255,255,.95);box-shadow:0 2px 6px -2px rgba(24,28,37,.25);transition:margin .3s var(--spring)}
.avatars:hover span:not(:first-child){margin-left:-3px}

/* segmented tab bar with a sliding thumb */
.tabs{position:sticky;top:10px;z-index:60;width:fit-content;max-width:100%;margin:14px auto 0;padding:4px;gap:2px;border-radius:var(--r-pill);background:var(--chrome);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:0 14px 34px -16px rgba(24,28,37,.28),inset 0 1px 0 rgba(255,255,255,.85)}
.tabs::before{content:"";position:absolute;top:4px;bottom:4px;left:var(--tx,4px);width:var(--tw,0);border-radius:var(--r-pill);background:#fff;box-shadow:0 3px 10px -2px rgba(24,28,37,.2),0 0 0 .5px rgba(24,28,37,.06);transition:left .45s var(--spring),width .45s var(--spring)}
.tabs.no-anim::before{transition:none}
.tab{position:relative;z-index:1;min-height:40px;padding:0 15px;border-radius:var(--r-pill);background:transparent;transition:color .2s}
.tab[aria-selected="true"]{background:transparent;color:var(--ink)}
.tab:active .ico{transform:scale(.85)}
.tab .ico{transition:transform .3s var(--spring)}

/* surfaces */
.head h1{font-weight:700}
.eyebrow .dot{box-shadow:0 0 0 4px var(--p-16)}
.card,.tile,.alerts,.tbl-card{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--lift)}
.card-w,.tile{background:var(--glass-hi)}
.cap{border:1px solid var(--glass-line);box-shadow:var(--lift);background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.5) 26%,rgba(244,206,190,.82) 76%,rgba(236,178,155,.92) 100%)}
.gauge{background:var(--chrome-dk);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-color:rgba(255,255,255,.1);box-shadow:0 24px 50px -26px rgba(24,28,37,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.itile{background:var(--glass-hi);border:1px solid var(--glass-line)}
.arow.focus{background:var(--glass-hi);border:1px solid var(--glass-line)}
.arow.focus .itile{background:#fff}
.dark-foot{background:var(--chrome-dk)}
.keybox{background:rgba(255,255,255,.6);border:1px solid var(--glass-line)}
.warn{background:linear-gradient(180deg,rgba(251,238,233,.92),rgba(246,220,210,.92))}

/* everything clickable responds */
.tap{cursor:pointer;transition:transform .4s var(--spring),box-shadow .3s,background .25s}
.tap:hover{transform:translateY(-3px);box-shadow:0 1px 1px rgba(24,28,37,.03),0 28px 50px -26px rgba(70,44,30,.42),inset 0 1px 0 #fff}
.tile.tap:hover{background-color:rgba(255,255,255,.9)}
.tap:active{transform:scale(.97);transition-duration:.12s}
button.tile{display:block;width:100%;font:inherit;color:inherit;text-align:start}
.tile .row{display:flex}
button.figure{width:100%;font:inherit;color:inherit;text-align:start;border:0;background:transparent;border-radius:var(--r-lg);padding:6px 8px 14px;cursor:pointer;transition:background .25s,transform .4s var(--spring)}
button.figure:hover{background:rgba(255,255,255,.4)}
button.figure:active{transform:scale(.985)}
.figure .label,.figure .big,.figure .unit{display:block}
button.pill{border:0;cursor:pointer;font:inherit;font-size:var(--fs-xs);font-weight:650;transition:background .2s,transform .3s var(--spring)}
button.pill:active{transform:scale(.94)}
.tap-pill{background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--glass-line);min-height:32px}
.tap-pill:hover{background:#fff}
.tap-pill .ico{width:14px;height:14px}
.tap-row{cursor:pointer;border-radius:16px;transition:background .2s}
.tap-row:hover{background:rgba(255,255,255,.6)}
.set-row.tap-row{padding-inline:10px;margin-inline:-10px}
.when .ico{display:inline-block;width:13px;height:13px;vertical-align:-2px;opacity:.55}
.linkbtn{all:unset;cursor:pointer;font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-color:var(--primary);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:4px}
.linkbtn:focus-visible,.legend button:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

/* charts */
.barfield{cursor:pointer;touch-action:pan-y}
.barfield i{background:rgba(24,28,37,.15);border-radius:2px 2px 1px 1px;transition:background .2s}
.barfield i.hi{background:linear-gradient(180deg,#E8957A,var(--primary))}
.barfield i.sel{background:var(--ink)}
.barfield i.hov{background:var(--primary-deep)}
.marker{background:var(--glass-hi);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:12px;transition:opacity .2s,left .45s var(--spring),bottom .45s var(--spring)}
.marker.hl{background:var(--primary);border-color:rgba(255,255,255,.4)}
.barfield:hover .marker{opacity:0}
.tip{position:absolute;top:-6px;left:clamp(48px,var(--x),calc(100% - 48px));z-index:4;transform:translate(-50%,-100%) scale(.92);opacity:0;pointer-events:none;background:var(--chrome-dk);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;border-radius:12px;padding:5px 11px;font-size:var(--fs-xs);line-height:1.4;white-space:nowrap;direction:rtl;box-shadow:0 12px 24px -10px rgba(24,28,37,.5);transition:opacity .15s,transform .25s var(--spring)}
[dir=ltr] .tip{direction:ltr}
.tip.on{opacity:1;transform:translate(-50%,-100%)}
.tip b{font-family:"Manrope",sans-serif;font-weight:700;margin-inline-end:6px}
.axis button{border:0;font:inherit;font-size:var(--fs-xs);font-weight:650;min-width:32px;height:28px;padding:0 9px;border-radius:var(--r-pill);background:var(--fill);color:var(--ink);cursor:pointer;transition:background .2s,color .2s,transform .3s var(--spring)}
.axis button:hover{background:var(--fill-2)}
.axis button.hi{background:var(--primary)}
.axis button[aria-pressed="true"]{background:var(--ink);color:#fff}
.axis button:active{transform:scale(.9)}
.axis span{background:var(--fill)}
.readout{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:12px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.readout b{color:var(--ink);font-weight:650}
.legend button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 9px;margin:0 -5px;border-radius:var(--r-pill);transition:background .2s,color .2s}
.legend button:hover{background:rgba(255,255,255,.1)}
.legend button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.gauge .legend button:focus-visible,.gauge :focus-visible{outline-color:#fff}
/* narrow cards (two side by side on phones): the legend wraps instead of running past the card edge */
.legend{flex-wrap:wrap;row-gap:4px}
@media (max-width:480px){.gauge .legend{justify-content:center;column-gap:2px}.gauge .legend button{margin:0;padding:0 7px}}
/* window buttons keep their look but get a finger-sized hit area on touch screens */
@media (pointer:coarse){.lights>*{width:32px;height:32px}.lights>*::before{inset:9.5px}}
.gauge path[data-gsel]{cursor:pointer;transition:stroke-width .35s var(--spring),opacity .3s,stroke .3s}

/* tables, search, filters */
.kt tbody tr:hover{background:rgba(255,255,255,.55)}
.kt tbody tr.click{cursor:pointer}
.kt tbody tr.click:focus-visible{outline-offset:-2px}
.rowbtn{background:var(--fill);transition:background .2s,transform .3s var(--spring)}
.rowbtn:hover{background:var(--fill-2)}
.rowbtn:active{transform:scale(.95)}
.search,.fpills,.pager button{background:var(--fill)}
.fpills button{transition:background .2s,color .2s}
.fpills button[aria-pressed="true"]{background:#fff;box-shadow:0 3px 8px -2px rgba(24,28,37,.18),0 0 0 .5px rgba(24,28,37,.05)}

/* sheets */
.modal .scrim{background:rgba(40,30,26,.2);-webkit-backdrop-filter:blur(10px) saturate(130%);backdrop-filter:blur(10px) saturate(130%)}
.dialog{background:var(--chrome);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);border:1px solid rgba(255,255,255,.75);border-radius:32px;box-shadow:0 70px 140px -40px rgba(24,28,37,.5),0 0 0 .5px rgba(24,28,37,.06),inset 0 1px 0 rgba(255,255,255,.9)}
.modal.open .scrim{animation:fadeIn .3s var(--ease)}
.modal.open .dialog{animation:popIn .45s var(--spring)}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.95)}}
.dialog .x{width:36px;height:36px;top:16px;border-radius:50%;background:var(--fill)}
.field input,.field select{background:rgba(255,255,255,.7);border-color:var(--line-2);border-radius:14px}
.mbig{font-family:"Manrope",sans-serif;font-size:56px;font-weight:300;letter-spacing:-.04em;line-height:1.1;margin-top:14px}
.mbig small{font-family:var(--font);font-size:var(--fs-sm);font-weight:500;letter-spacing:0;color:var(--secondary)}
.spark-wrap{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:18px;padding:14px 14px 10px;margin-top:12px}
.spark{display:block;width:100%;height:auto;overflow:visible}
.mnote{font-size:var(--fs-sm);color:var(--text-2);margin:12px 0 0}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.meter{margin-top:14px;background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:18px;padding:12px 14px}
.meter .progress{background:var(--fill)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.dl div{background:rgba(255,255,255,.55);border:1px solid var(--glass-line);border-radius:14px;padding:10px 12px;min-width:0}
.dl dt{font-size:var(--fs-xs);color:var(--secondary)}
.dl dd{margin:2px 0 0;font-size:var(--fs-sm);font-weight:600}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;padding:0;margin:18px 0 0}
.chip{position:relative;display:flex;align-items:center;justify-content:center;height:58px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--line-2);font-weight:650;font-size:var(--fs-md);cursor:pointer;transition:background .2s,color .2s,transform .3s var(--spring)}
.chip:hover{background:#fff}
.chip:active{transform:scale(.96)}
.chip input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chip:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:has(input:focus-visible){outline:2.5px solid var(--ink);outline-offset:2px}

/* toast */
.toast{display:flex;align-items:center;gap:12px;background:var(--chrome-dk);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-pill);padding:10px 20px;min-height:48px;transition:transform .5s var(--spring),visibility .5s}
.toast button{flex:none;border:0;border-radius:var(--r-pill);min-height:34px;margin:-4px 0;margin-inline-end:-12px;padding:0 14px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:650;font-size:var(--fs-xs);cursor:pointer}
.toast button:hover{background:rgba(255,255,255,.28)}
.toast :focus-visible{outline-color:#fff}

/* popovers */
.pop{position:fixed;z-index:220;display:none;width:min(360px,calc(100vw - 24px));overflow:auto;padding:8px;border-radius:24px;background:var(--chrome);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);border:1px solid rgba(255,255,255,.75);box-shadow:0 40px 80px -30px rgba(24,28,37,.45),0 0 0 .5px rgba(24,28,37,.06),inset 0 1px 0 #fff;transform-origin:50% 0}
.pop.open{display:block;animation:popIn .4s var(--spring)}
.pop h3{margin:0;padding:8px 10px 6px;font-size:var(--fs-xs);font-weight:700;color:var(--secondary)}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px}
.pop-foot{display:flex;gap:8px;padding:4px 4px 2px}
.pop-foot .btn{flex:1;min-height:40px}
.pop-id{display:flex;align-items:center;gap:12px;padding:8px 10px}
.pop-id b,.mi b{display:block;font-size:var(--fs-sm);font-weight:650;line-height:1.5}
.pop-id small,.mi small{display:block;font-size:var(--fs-xs);color:var(--secondary);line-height:1.5}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:7px 10px;border:0;border-radius:14px;background:transparent;text-align:start;color:inherit;font:inherit;cursor:pointer;transition:background .15s}
.mi:hover,.mi:focus-visible{background:rgba(255,255,255,.8)}
.mi>.ico{width:18px;height:18px;color:var(--text-2)}
.mi .itile{width:36px;height:36px;border-radius:11px;flex:none}
.mi .itile .ico{width:17px;height:17px}
.mi>span:not(.end):not(.itile):not(.av){flex:1;min-width:0}
.mi .end{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;flex:none}
.mi .end .ico{width:14px;height:14px;opacity:.5}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:#D3D4D9;font-size:var(--fs-xs);font-weight:700;border:2px solid #fff}
kbd{font:600 11px/1 "Manrope",sans-serif;padding:5px 7px;border-radius:7px;background:var(--fill);color:var(--text-2);direction:ltr;white-space:nowrap}
.switch.sm{width:40px;height:24px;display:inline-block}
.switch.sm::before{display:none}
.switch.sm::after{top:3px;inset-inline-start:3px;width:18px;height:18px}
.switch[data-on="true"]{background:var(--primary)}
[dir=rtl] .switch.sm[data-on="true"]::after{transform:translateX(-16px)}
[dir=ltr] .switch.sm[data-on="true"]::after{transform:translateX(16px)}

/* spotlight */
.spot{position:fixed;inset:0;z-index:240;display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
.spot.open{display:flex}
.spot .scrim{position:absolute;inset:0;border:0;background:rgba(40,30,26,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadeIn .25s}
.spot-box{position:relative;width:min(640px,100%);border-radius:26px;overflow:hidden;background:var(--chrome);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);border:1px solid rgba(255,255,255,.75);box-shadow:0 60px 120px -40px rgba(24,28,37,.55),0 0 0 .5px rgba(24,28,37,.08),inset 0 1px 0 #fff;animation:popIn .4s var(--spring)}
.spot-in{display:flex;align-items:center;gap:12px;height:62px;padding:0 20px}
.spot-in:focus-within{box-shadow:inset 0 -2px 0 var(--primary)}
.spot-in .ico{width:22px;height:22px;color:var(--secondary)}
.spot-in input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;font-size:20px}
.spot-list{max-height:min(440px,58vh);overflow:auto;padding:6px 8px 8px;border-top:1px solid var(--line)}
.spot-g{padding:10px 10px 4px;font-size:11px;font-weight:700;color:var(--secondary)}
.spot-list .mi[aria-selected="true"]{background:var(--primary);color:var(--ink)}
.spot-list .mi[aria-selected="true"] small,.spot-list .mi[aria-selected="true"]>.ico{color:rgba(24,28,37,.78)}
.spot-list .mi[aria-selected="true"] kbd{background:rgba(255,255,255,.35);color:var(--ink)}
.spot-empty{padding:18px;margin:0;text-align:center;color:var(--secondary);font-size:var(--fs-sm)}

/* dock (shown while the window is minimised) */
.dock{position:fixed;left:50%;bottom:18px;z-index:150;padding:8px;border-radius:26px;background:var(--chrome);-webkit-backdrop-filter:var(--blur-lg);backdrop-filter:var(--blur-lg);border:1px solid rgba(255,255,255,.75);box-shadow:0 30px 60px -24px rgba(24,28,37,.45),inset 0 1px 0 #fff;transform:translate(-50%,160%);visibility:hidden;transition:transform .55s var(--spring),visibility 0s .55s}
.dock.on{transform:translate(-50%,0);visibility:visible;transition:transform .55s var(--spring),visibility 0s}
.dock button{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:0;padding-inline:8px 18px;border:0;border-radius:18px;background:transparent;font:inherit;font-weight:650;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap}
.dock button:hover{background:rgba(255,255,255,.6)}
.appic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#E8957A,#C15F3C);box-shadow:0 6px 14px -6px rgba(193,95,60,.8),inset 0 1px 0 rgba(255,255,255,.35)}

function series(anchors,n,seed){let s=seed||1;const r=()=>(s=(s*9301+49297)%233280)/233280;const o=[];for(let i=0;i<n;i++){const p=i/(n-1)*(anchors.length-1),k=Math.floor(p),f=p-k,a=anchors[k],b=anchors[Math.min(k+1,anchors.length-1)];const v=a+(b-a)*(f*f*(3-2*f));o.push(Math.max(8,Math.min(100,v*(.8+r()*.32))))}return o}

function chart(key,height,label){

 const sums=Array.from({length:c.D},()=>[0,0]);c.h.forEach((v,i)=>{const d=sums[seg(i)];d[0]+=v;d[1]++});
 const avg=sums.map(([s,k])=>s/k),peak=avg.indexOf(Math.max(...avg)),show=sel==null?peak:sel,hiFrom=Math.floor(c.D*c.hi);
 chartCache[key]={n,D:c.D,avg,S:c.S,labels:c.labels};

function table(cfg){
 const {cols,rows,note,empty,row}=cfg;
 let data=rows.slice();
 if(state.sort.k){const c=cols.find(c=>c.k===state.sort.k);if(c&&c.sort)data.sort((a,b)=>{const x=c.sort(a),y=c.sort(b);return (x>y?1:x<y?-1:0)*state.sort.dir})}
 const pages=Math.max(1,Math.ceil(data.length/state.perPage));state.page=Math.min(Math.max(1,state.page),pages);
 const part=cfg.all?data:data.slice((state.page-1)*state.perPage,state.page*state.perPage);
 const th=cols.map(c=>{const s=state.sort.k===c.k?(state.sort.dir>0?'ascending':'descending'):'none';return `<th scope="col" class="${c.num?'n':''}" ${c.sort?`aria-sort="${s}"`:''}>${c.sort?`<button type="button" data-sort="${c.k}">${c.label}<span class="ar" aria-hidden="true"><span class="u">▲</span><span class="d">▼</span></span></button>`:c.label}</th>`}).join('');
 let body;
 if(state.demo==='loading'||state.loading){body=Array.from({length:4},()=>`<tr>${cols.map(()=>`<td><span class="sk" style="width:${50+Math.random()*40|0}%"></span></td>`).join('')}</tr>`).join('')}
 else if(state.demo==='error'){body=`<tr><td colspan="${cols.length}"><div class="state err"><span class="itile">${ic('alert')}</span><h3>${t('بارگذاری داده‌ها ناموفق بود','Could not load data')}</h3><p>${t('اتصال نمایشی قطع شد. دوباره تلاش کنید.','The demo connection dropped. Try again.')}</p><button class="btn btn-dark" type="button" data-retry>${t('تلاش دوباره','Retry')}</button></div></td></tr>`}
 else if(!part.length){body=`<tr><td colspan="${cols.length}"><div class="state"><span class="itile">${ic('empty')}</span><h3>${empty||t('نتیجه‌ای یافت نشد','No results')}</h3><p>${t('عبارت جست‌وجو یا فیلتر وضعیت را تغییر دهید.','Change the search or status filter.')}</p><button class="btn btn-line" type="button" data-clear>${t('پاک کردن فیلترها','Clear filters')}</button></div></td></tr>`}
 else body=part.map(r=>`<tr${row?` class="click" tabindex="0" ${row(r)}`:''}>${cols.map(c=>`<td class="${(c.num?'n ':'')+(c.cls||'')}" data-l="${esc(c.label)}">${c.cell(r)}</td>`).join('')}</tr>`).join('');
 const from=data.length?(state.page-1)*state.perPage+1:0,to=Math.min(data.length,state.page*state.perPage);
 const pager=(cfg.all||!data.length||state.demo||state.loading)?'':`<div style="display:flex;gap:12px;align-items:center"><span class="pcount">${t('نمایش','Showing')} <span class="num">${from}–${to}</span> ${t('از','of')} <span class="num">${data.length}</span></span><div class="pager" role="navigation" aria-label="${t('صفحه‌بندی','Pagination')}"><button type="button" data-page="${state.page-1}" ${state.page<=1?'disabled':''} aria-label="${t('قبلی','Previous')}">‹</button>${Array.from({length:pages},(_,i)=>`<button type="button" data-page="${i+1}" ${i+1===state.page?'aria-current="page"':''}>${i+1}</button>`).join('')}<button type="button" data-page="${state.page+1}" ${state.page>=pages?'disabled':''} aria-label="${t('بعدی','Next')}">›</button></div></div>`;
 return `<div class="twrap"><table class="kt"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div><div class="tfoot"><p class="fnote">${note}</p>${pager}</div>`;
