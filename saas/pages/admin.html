<body>

 <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 19.5c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"/><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M18 14.8c1.8.6 3.1 2.1 3.5 4.7"/></symbol>

 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>

<noscript><p class="state">این صفحه به جاوااسکریپت نیاز دارد.</p></noscript>

<!-- ============ owner login ============ -->
<section class="auth" id="auth" hidden>
 <form class="auth-card" id="loginForm" novalidate>
  <span class="brand"><svg class="ico" aria-hidden="true"><use href="#i-brand"/></svg><span>کلاود ایران</span><span class="pill w">مدیریت</span></span>
  <h1>ورود مدیر</h1>
  <p class="lead">این بخش فقط برای مالک سرویس است.</p>
  <div class="field">
   <label for="pw">رمز مدیر</label>
   <div class="pw"><input id="pw" type="password" autocomplete="current-password" dir="ltr"></div>
  </div>
  <p class="err-line" id="loginErr" role="alert"></p>
  <button class="btn btn-dark">ورود</button>
  <p class="legal"><a class="linkbtn" href="/">بازگشت به وب‌سایت</a></p>
 </form>
</section>

<!-- ============ admin ============ -->
<div class="app admin" id="dash" hidden>
 <div class="screen">
  <div class="admin-hero">
   <header class="top">
    <a class="brand" href="/" aria-label="کلاود ایران — وب‌سایت"><svg class="ico" aria-hidden="true"><use href="#i-brand"/></svg><span>کلاود ایران</span><span class="pill w">مدیریت</span></a>
    <nav class="tabs" role="tablist" aria-label="بخش‌های مدیریت" id="tabs"></nav>
    <div class="top-end">
     <button class="demo-pill mode-pill" type="button" id="modePill"><span class="dot" aria-hidden="true"></span><span id="modeText"></span></button>
     <button class="icon-btn" type="button" id="refreshBtn" aria-label="به‌روزرسانی"><svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg></button>
     <button class="icon-btn" type="button" id="logoutBtn" aria-label="خروج"><svg class="ico" aria-hidden="true"><use href="#i-logout"/></svg></button>
    </div>
   </header>
  </div>
  <main id="view" tabindex="-1"></main>
  <footer class="foot"><span class="f-l"><span class="live" aria-hidden="true"></span><span id="footNote">پنل مدیریت کلاود ایران · همهٔ اقدامات در گزارش رویدادها ثبت می‌شود.</span></span><span class="f-r"><a class="foot-btn" href="/app/">کنسول مشتریان ↗</a><a class="foot-btn" href="/">وب‌سایت ↗</a></span></footer>
 </div>
</div>
<div class="pop" id="pop" role="dialog" aria-label="منو"></div>
<div class="modal" id="modal" aria-hidden="true"><button class="scrim" type="button" id="scrim" aria-label="بستن" tabindex="-1"></button><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><button class="x" type="button" id="dlgClose" aria-label="بستن"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button><div id="dlgBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
