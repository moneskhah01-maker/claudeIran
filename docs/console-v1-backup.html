<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E9E9EB">
<title>کنسول کلاود ایران | ClaudeIran Console — UI Concept</title>
<link rel="preload" href="/fonts/Vazirmatn-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/Manrope-wght.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ClaudeIran Console — Keel dashboard language. Only palette change: Primary -> Terracotta #D97757 */
@font-face{font-family:"Manrope";src:url("/fonts/Manrope-wght.woff2") format("woff2");font-weight:200 800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Vazirmatn";src:url("/fonts/Vazirmatn-wght.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
 --primary:#D97757; --primary-deep:#C15F3C; --secondary:#6B6F78; --ink:#181C25; --white:#FFFFFF;
 --canvas:#E9E9EB; --screen:#EEEEF0; --card:#F5F5F7; --card-2:#FAFAFB; --line:#E2E2E6; --line-2:#D9D9DE;
 --tail:#8A8D95; --text-2:#4F535D; --on-dark-2:#A9ADB6; --dark-line:#2B303B; --dark-2:#222733;
 --p-16:rgba(217,119,87,.16); --p-30:rgba(217,119,87,.30); --p-45:rgba(217,119,87,.45);
 /* Keel's semantic "down" badge (not the brand colour) */
 --down:#B4232A; --down-bg:#FBE3E4;
 --fs-xs:12px; --fs-sm:14px; --fs-base:15px; --fs-md:18px; --fs-lg:28px; --fs-xl:clamp(44px,5.6vw,80px);
 --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px; --r-pill:999px;
 --shadow:0 40px 90px -30px rgba(24,28,37,.22),0 12px 30px -16px rgba(24,28,37,.10);
 --shadow-soft:0 18px 50px -26px rgba(24,28,37,.18);
 --font:"Manrope","Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif; --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:8px}
.dark :focus-visible{outline-color:#fff}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flip{transform:scaleX(-1)}
[dir=ltr] .flip{transform:none}
.num,.en,code{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:300;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px}
.skip:focus{top:10px}

/* ===== shell ===== */
.app{max-width:1400px;margin:0 auto;padding:16px}
.screen{background:var(--screen);border-radius:30px;padding:20px 24px 28px;min-height:calc(100vh - 32px)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:var(--fs-md);white-space:nowrap}
.brand svg{width:28px;height:28px}
.managers{display:flex;align-items:center;gap:10px;margin-inline-start:18px}
.avatars{display:flex;direction:ltr}
.avatars span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;background:#D3D4D9;color:var(--ink);border:2px solid var(--screen);margin-left:-8px}
.avatars span:first-child{margin-left:0}
.avatars span:nth-child(2){background:#BFC1C7}
.avatars span:nth-child(3){background:#A9ADB6}
.avatars span:last-child{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;border:1px solid transparent;font-size:var(--fs-sm);font-weight:650;white-space:nowrap;background:var(--white);transition:background .2s,transform .2s}
.btn .ico{width:16px;height:16px}
.btn:hover{background:var(--card)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#2A303D}
.btn-line{background:transparent;border-color:var(--line-2)}
.btn-line:hover{background:var(--white)}
.btn-primary{background:var(--primary);color:var(--ink)}
.btn-primary:hover{background:var(--primary);box-shadow:inset 0 -2px 0 var(--primary-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.demo-pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.7);border:1px solid var(--line-2);font-size:var(--fs-xs);font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none;display:inline-block}
.icon-btn{width:44px;height:44px;border-radius:13px;background:var(--white);border:0;display:grid;place-items:center;position:relative}
.icon-btn.bell::after{content:"";position:absolute;top:10px;inset-inline-end:11px;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px #fff}
.me{width:44px;height:44px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:13px;background:var(--white);border:0;font-size:var(--fs-sm);font-weight:600;color:var(--text-2);white-space:nowrap}
.tab .ico{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tab .count{font-size:var(--fs-xs);background:var(--p-16);color:var(--ink);border-radius:var(--r-pill);padding:0 7px;line-height:20px}
.tab[aria-selected="true"] .count{background:var(--primary);color:var(--ink)}

/* ===== page head ===== */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin:30px 0 18px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:700;color:var(--text-2);letter-spacing:.12em}
.head h1{margin:6px 0 0;font-size:var(--fs-lg);font-weight:500;line-height:1.35}
.head p{margin:2px 0 0;font-size:var(--fs-sm);color:var(--text-2)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== cards / tiles ===== */
.card{background:var(--card-2);border-radius:var(--r-lg);padding:20px;min-width:0}
.card-w{background:var(--white)}
.card h2{margin:0;font-size:var(--fs-md);font-weight:600;line-height:1.5}
.card .sub{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.grid-main{display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.stack{display:grid;gap:12px;align-content:start}
.figure{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 4px 14px}
.figure .label{font-size:var(--fs-sm);font-weight:500}
.figure .big{font-family:"Manrope",sans-serif;font-size:var(--fs-xl);font-weight:400;letter-spacing:-.05em;line-height:1;margin-top:10px}
.figure .big .tail{color:var(--tail)}
.figure .unit{font-size:var(--fs-xs);color:var(--secondary);margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--card-2);border-radius:var(--r-md);padding:14px 15px 12px;min-width:0}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile b{font-family:"Manrope",sans-serif;font-size:var(--fs-lg);font-weight:450;letter-spacing:-.03em;line-height:1.2}
.tile small{display:block;font-size:var(--fs-xs);color:var(--secondary);margin-top:4px;line-height:1.6}
.bd{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;white-space:nowrap;direction:ltr}
.bd.up{background:var(--p-16);color:var(--ink)}
.bd.down{background:var(--down-bg);color:var(--down)}
.bd.flat{background:#E4E4E8;color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:650;white-space:nowrap;background:#E4E4E8}
.pill.p{background:var(--primary);color:var(--ink)}
.pill.soft{background:var(--p-16)}
.pill.w{background:var(--white);border:1px solid var(--line)}
.pill.dk{background:var(--ink);color:#fff}

/* bar field */
.barfield{height:170px;display:flex;align-items:flex-end;gap:2px;direction:ltr;margin-top:14px;position:relative}
.barfield i{flex:1;min-width:1px;background:#C3C5CB;border-radius:1px;height:var(--h)}
.barfield i.hi{background:var(--primary)}
.marker{position:absolute;bottom:calc(var(--y) + 10px);left:var(--x);transform:translateX(-50%);background:var(--white);box-shadow:0 8px 20px -8px rgba(24,28,37,.3);border-radius:10px;padding:4px 9px;font-size:var(--fs-xs);line-height:1.4;text-align:center;white-space:nowrap;direction:rtl}
.marker b{display:block;font-family:"Manrope",sans-serif;font-weight:600;direction:ltr}
.marker.hl{background:var(--primary)}
.axis{display:flex;justify-content:space-between;direction:ltr;margin-top:10px;gap:4px}
.axis span{font-size:var(--fs-xs);font-weight:600;min-width:28px;height:24px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-pill);background:#DADBE0}
.axis span.hi{background:var(--primary)}
/* stepped bars + gauge */
.steps{display:flex;align-items:flex-end;height:110px;margin-top:14px;direction:ltr}
.steps i{flex:1;display:block;background:linear-gradient(180deg,var(--white),rgba(255,255,255,0));border-top:3px solid var(--white)}
.steps i.hi{background:linear-gradient(180deg,var(--p-45),rgba(217,119,87,0));border-top-color:var(--primary);position:relative}
.steps i.lo{border-top-color:#C9CAD0;background:linear-gradient(180deg,#E6E6EA,rgba(230,230,234,0))}
.steps i.hi .pill{position:absolute;top:-15px;left:50%;transform:translateX(-50%);height:24px}
.legend{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:var(--fs-xs);color:var(--secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%;background:#C9CAD0;display:inline-block}
.legend i.p{background:var(--primary)}
.mini .big{font-family:"Manrope",sans-serif;font-size:36px;font-weight:400;letter-spacing:-.03em;line-height:1.1;margin-top:8px}
.gauge{background:var(--ink);color:#fff}
.gauge .sub,.gauge .legend{color:var(--on-dark-2)}
.gauge .legend i{background:#4A505D}
.gauge svg{width:100%;max-width:220px;margin:12px auto 0}
/* terracotta gradient alert card (Keel "34 days") */
.cap{border-radius:var(--r-lg);padding:20px;background:linear-gradient(180deg,var(--card-2) 0%,var(--card-2) 24%,#F3D9CF 76%,#EDC4B5 100%);display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:330px}
.cap .art{position:absolute;top:18px;inset-inline-end:18px;width:72px;height:72px;color:rgba(24,28,37,.10)}
.cap .big{font-family:"Manrope",sans-serif;font-size:72px;font-weight:300;line-height:1;margin-top:auto;letter-spacing:-.05em}
.cap .big small{font-size:var(--fs-md);font-weight:500;letter-spacing:0;margin-inline-start:8px}
.progress{height:8px;background:rgba(255,255,255,.75);border-radius:var(--r-pill);overflow:hidden;margin:16px 0 8px;direction:ltr}
.progress span{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .4s var(--ease)}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-xs)}
.cap p{margin:12px 0 0;font-size:var(--fs-sm);line-height:1.85}
/* alerts panel */
.alerts{background:var(--white);border-radius:var(--r-lg);padding:18px 18px 12px}
.arow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.itile{width:44px;height:44px;border-radius:13px;background:var(--card);display:grid;place-items:center}
.itile .ico{width:20px;height:20px}
.arow h3{margin:0;font-size:var(--fs-sm);font-weight:600;line-height:1.55}
.arow p{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary);line-height:1.6}
.arow .when{font-size:var(--fs-xs);color:var(--secondary);align-self:start;padding-top:2px;white-space:nowrap}
.arow.focus{background:var(--card);border-radius:18px;border-bottom:0;margin:6px 0;padding:14px 12px}
.arow.focus .itile{background:var(--white)}
.arow .acts{grid-column:2 / -1;display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.unread{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;margin-inline-start:8px;vertical-align:middle}
.dark-foot{margin-top:12px;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dark-foot span{font-size:var(--fs-xs);color:var(--on-dark-2)}
.dark-foot strong{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.dark-foot .ico{color:var(--primary);stroke-width:2.4}
.note-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note-card .l{display:flex;gap:14px;align-items:center}
.note-card h2{font-size:var(--fs-sm)}
.note-card p{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}

/* ===== Keel table ===== */
.tbl-card{background:var(--white);border-radius:var(--r-lg);padding:18px 20px 14px;margin-top:12px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.tools .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r-pill);background:var(--card);min-width:240px}
.search input{border:0;background:transparent;outline:0;font-size:var(--fs-sm);width:100%}
.search:focus-within{box-shadow:0 0 0 2.5px var(--ink)}
.fpills{display:flex;gap:4px;background:var(--card);border-radius:var(--r-pill);padding:4px}
.fpills button{border:0;background:transparent;min-height:36px;padding:0 13px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:650;color:var(--text-2)}
.fpills button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(24,28,37,.1)}
.twrap{overflow-x:auto}
.kt{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.kt th{font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;color:var(--secondary);text-align:start;padding:12px 8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.kt th.n,.kt td.n{text-align:end}
.kt th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;min-height:28px;border-radius:6px}
.kt th button:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.kt th .ar{display:inline-grid;line-height:.55;font-size:10px;color:#B9BBC2}
.kt th[aria-sort="ascending"] .ar .u,.kt th[aria-sort="descending"] .ar .d{color:var(--ink)}
.kt td{padding:14px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.kt tbody tr{transition:background .15s}
.kt tbody tr:hover{background:var(--card-2)}
.kt tbody tr:last-child td{border-bottom:0}
.kt .pc{font-weight:600}
.kt .dim{color:var(--secondary)}
.kt .id{font-family:"Manrope",sans-serif;color:var(--secondary);direction:ltr;unicode-bidi:isolate}
[dir=rtl] .kt div.id{text-align:right}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.st i{width:7px;height:7px;border-radius:50%;background:var(--primary);display:inline-block}
.st.off i{background:#B9BBC2}
.st.bad{color:var(--down)} .st.bad i{background:var(--down)}
.rowbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;background:var(--card);font-size:var(--fs-xs);font-weight:650}
.rowbtn:hover{background:#ECECEF}
.rowbtn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.rowbtn[disabled]{opacity:.45;cursor:not-allowed}
.amt.plus{color:var(--ink);font-weight:650}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.fnote{font-size:var(--fs-xs);color:var(--secondary);margin:0;line-height:1.7}
.pager{display:flex;gap:4px;align-items:center;direction:ltr}
.pager button{min-width:36px;height:36px;border-radius:var(--r-pill);border:0;background:var(--card);font-size:var(--fs-xs);font-weight:700;font-family:"Manrope",sans-serif}
.pager button[aria-current="page"]{background:var(--ink);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pcount{font-size:var(--fs-xs);color:var(--secondary)}
/* states */
.state{padding:40px 16px;text-align:center}
.state .itile{margin:0 auto 12px}
.state h3{margin:0;font-size:var(--fs-sm);font-weight:650}
.state p{margin:4px 0 14px;font-size:var(--fs-xs);color:var(--secondary)}
.state.err .itile{background:var(--down-bg);color:var(--down)}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#EDEDF0 0%,#F7F7F9 40%,#EDEDF0 80%);background-size:300% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}

/* ===== modal ===== */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .scrim{position:absolute;inset:0;background:rgba(24,28,37,.42);backdrop-filter:blur(3px);border:0}
.dialog{position:relative;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--white);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px}
.dialog .x{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:13px;border:0;background:var(--card);display:grid;place-items:center}
.dialog h2{margin:0;font-size:var(--fs-md);font-weight:650;padding-inline-end:52px}
.dialog .sub{margin:2px 0 0;font-size:var(--fs-xs);color:var(--secondary)}
.field{display:grid;gap:6px;margin-top:16px}
.field label{font-size:var(--fs-xs);font-weight:650}
.field input,.field select{height:48px;border-radius:13px;border:1px solid var(--line-2);background:var(--card-2);padding:0 14px;font-size:var(--fs-sm);width:100%}
.field input:focus,.field select:focus{outline:2.5px solid var(--ink);outline-offset:1px}
.field .hint{font-size:var(--fs-xs);color:var(--secondary)}
.f-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:22px;flex-wrap:wrap}
.keybox{margin-top:16px;background:var(--card);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.keybox code{flex:1;font:600 14px/1.5 ui-monospace,"Cascadia Code",Consolas,monospace;word-break:break-all}
.warn{margin-top:12px;border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,#FBEEE9,#F6DCD2);font-size:var(--fs-sm);line-height:1.8;display:flex;gap:10px}
.warn .ico{margin-top:4px}

/* toast */
.toast{position:fixed;z-index:250;bottom:20px;inset-inline-start:50%;transform:translate(50%,140%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:var(--fs-sm);box-shadow:var(--shadow);transition:transform .3s var(--ease),visibility .3s;max-width:calc(100% - 32px);visibility:hidden}
[dir=ltr] .toast{transform:translate(-50%,140%)}
.toast.on{transform:translate(50%,0);visibility:visible}
[dir=ltr] .toast.on{transform:translate(-50%,0)}

 const S=[['email','اعلان‌های ایمیلی','Email notifications','دریافت وضعیت مصرف و هشدارهای حساب','Usage and account alerts'],['budget','هشدار سقف بودجه','Budget threshold alerts','اعلان پیش از رسیدن به حد مجاز','Warn before the limit'],['limits','محدودسازی مدل‌ها','Model allowlist','اجازه استفاده تنها از مدل‌های تأییدشده','Only approved models'],['security','اعلان ورود جدید','New sign-in alerts','خبر دادن درباره ورود از دستگاه تازه','Unfamiliar sign-ins']];
 return head(t('SECURITY · امنیت','SECURITY'),t('تنظیمات امنیتی','Security settings'),t('گزینه‌های نمایشی کنترل بودجه و دسترسی','Demo controls for cost and access'),`<span class="pill w">${t('تغییرات فقط در مرورگر','Local preview only')}</span>`)+
 `<div class="grid-main split2" style="grid-template-columns:1fr 1fr"><article class="card card-w"><div class="card-head"><div><h2>${t('کنترل‌ها و اعلان‌ها','Controls & alerts')}</h2><p class="sub">${t('نمونه','Sample')}</p></div></div>${S.map(([k,p,e,pd,ed])=>`<div class="set-row"><div><strong id="lbl-${k}">${t(p,e)}</strong><p>${t(pd,ed)}</p></div><button type="button" class="switch" role="switch" aria-checked="${!!state.settings[k]}" aria-labelledby="lbl-${k}" data-toggle="${k}"></button></div>`).join('')}</article>
 <div class="stack">${capCard()}<article class="card card-w"><h2>${t('مصرف از بودجه','Budget utilization')}</h2><p class="sub">${t('نسبت نمونه را تغییر دهید تا کارت‌ها به‌روز شوند.','Move the sample value to update the cards.')}</p><label class="sr-only" for="budgetRange">${t('درصد بودجه','Budget percentage')}</label><input type="range" id="budgetRange" min="0" max="100" value="${state.budget}"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-dark" type="button" data-toast="${t('تغییرات فقط در این پیش‌نمایش اعمال شدند.','Applied to this preview only.')}">${t('ثبت تغییرات نمایشی','Save demo changes')}</button></div></article></div></div>`;
}
const R={overview,usage,projects:projectsView,keys:keysView,requests:requestsView,billing,security};

/* ---- modals ---- */
let lastFocus=null;
function openModal(html){lastFocus=document.activeElement;document.getElementById('dlgBody').innerHTML=html;const m=document.getElementById('modal');m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';const f=m.querySelector('.dialog input,.dialog select');(f||document.getElementById('dlgClose')).focus()}
function closeModal(){const m=document.getElementById('modal');if(!m.classList.contains('open'))return;m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function reqModal(id){const r=requestData.find(x=>x.id===id)||requestData[0];const ok=r.status==='settled';
 openModal(`<h2 id="dlgTitle">${t('جزئیات یک درخواست','Request details')}</h2><p class="sub">${t('فرآیند مالی · داده آزمایشی','Financial timeline · test data')} · <span class="num">${r.id}</span></p><div class="alerts" style="padding:8px 0 0">
 <div class="arow"><span class="itile">${ic('lock')}</span><div><h3>${t('رزرو اعتبار','Credit reserved')}</h3><p>${t('نرخ توکن و سقف هزینه در لحظه ثبت شد.','Token rates and max charge locked at submission.')}</p></div><span class="pill">${t('ثبت شد','Recorded')}</span></div>
 <div class="arow"><span class="itile">${ic('send')}</span><div><h3>${t('درخواست به مدل ارسال شد','Sent to the model')}</h3><p>${t('یک شناسه، یک نوبت ارسال.','One ID, one submission.')}</p></div><span class="pill">${t('انجام شد','Done')}</span></div>
 <div class="arow focus"><span class="itile">${ic(ok?'check-sq':'alert')}</span><div><h3>${ok?t('تسویه با مصرف نهایی','Settled on final usage'):t('عدم تکمیل درخواست','Request not completed')}</h3><p>${ok?t('مانده اعتبار به کیف پول برگشت.','Unused credit returned to the wallet.'):t('درخواست ناموفق در سوابق ثبت شد.','The failed request was recorded.')}</p></div><span class="pill ${ok?'p':''}">${ok?t('تسویه شد','Settled'):t('ناموفق','Failed')}</span>
 <div class="acts"><span class="pill w">${t('هزینه','Cost')} <b class="num">${r.cost}</b> ${t('تومان','IRT')}</span><span class="pill w">${t('توکن','Tokens')} <span class="num">${r.tin?r.tin.toLocaleString('en-US')+' / '+r.tout:'—'}</span></span><span class="pill w en">${r.model}</span></div></div></div>
 <div class="dark-foot"><span>${t('صورت‌حساب این درخواست، قابل پیگیری با شناسه','This bill is traceable by its ID')}</span><strong>${t('شفاف تا سطح توکن','Transparent to the token')} ${ic('check')}</strong></div>`)}
function projectModal(){openModal(`<h2 id="dlgTitle">${t('پروژه جدید','New project')}</h2><p class="sub">${t('فقط در این پیش‌نمایش ساخته می‌شود · نمونه','Created in this preview only · sample')}</p><form id="projForm"><div class="field"><label for="pName">${t('نام پروژه','Project name')}</label><input id="pName" required maxlength="40" placeholder="${t('مثلاً دستیار فروش','e.g. Sales assistant')}"></div><div class="field"><label for="pModel">${t('مدل مجاز','Allowed model')}</label><select id="pModel"><option>Sonnet</option><option>Haiku</option></select></div><div class="field"><label for="pBudget">${t('سقف بودجه ماهانه (تومان)','Monthly cap (IRT)')}</label><input id="pBudget" inputmode="numeric" value="300,000"><span class="hint">${t('درخواست‌ها با رسیدن به سقف پیش از ارسال متوقف می‌شوند.','Requests pause before sending at the cap.')}</span></div><div class="f-actions"><button class="btn btn-dark" type="submit">${t('ساخت پروژه','Create project')}</button><button class="btn btn-line" type="button" data-close>${t('انصراف','Cancel')}</button></div></form>`)}
function keyModal(){openModal(`<h2 id="dlgTitle">${t('ساخت کلید آزمایشی','Create demo key')}</h2><p class="sub">${t('کلید واقعی ساخته نمی‌شود · نمونه','No real key is created · sample')}</p><form id="keyForm"><div class="field"><label for="kName">${t('عنوان کلید','Key name')}</label><input id="kName" required maxlength="40" value="Staging · Docs" dir="ltr"></div><div class="field"><label for="kProj">${t('پروژه','Project')}</label><select id="kProj">${projectData.map((p,i)=>`<option value="${i}">${pname(p)}</option>`).join('')}</select></div><div class="f-actions"><button class="btn btn-dark" type="submit">${t('ساخت کلید','Create key')}</button><button class="btn btn-line" type="button" data-close>${t('انصراف','Cancel')}</button></div></form>`)}
function keyShown(name,secret){document.getElementById('dlgBody').innerHTML=`<h2 id="dlgTitle">${t('کلید ساخته شد','Key created')}</h2><p class="sub"><span class="en">${esc(name)}</span> · ${t('نمونه','sample')}</p><div class="keybox"><code id="secret">${secret}</code><button class="btn" type="button" id="copySecret">${ic('copy')}<span>${t('کپی','Copy')}</span></button></div><div class="warn">${ic('alert')}<div><strong>${t('این کلید فقط همین یک‌بار نمایش داده می‌شود.','This key is shown only once.')}</strong><br>${t('آن را در جای امن نگه دارید. این رشته نمایشی است و به هیچ API متصل نیست.','Store it safely. This string is a demo and works with no API.')}</div></div><div class="f-actions"><button class="btn btn-dark" type="button" data-close>${t('ذخیره کردم','I’ve saved it')}</button></div>`;document.getElementById('copySecret').focus()}

/* ---- render ---- */
function render(){
 document.getElementById('tabs').innerHTML=NAV.map(([id,i,p,e])=>`<button class="tab" role="tab" type="button" data-go="${id}" aria-selected="${id===state.view}" ${id===state.view?'':'tabindex="-1"'}>${ic(i)}<span>${t(p,e)}</span>${id==='requests'?`<span class="count num">${requestData.length}</span>`:''}</button>`).join('');
 document.getElementById('view').innerHTML=R[state.view]();
}
function go(v,push=true){if(!R[v])v='overview';state.view=v;state.query='';state.filter='all';state.page=1;state.sort={k:null,dir:1};
 if(!STATIC&&!state.demo){state.loading=true;render();setTimeout(()=>{state.loading=false;render()},320)}else render();
 if(push)history.replaceState(null,'',`console.html?view=${v}&lang=${state.lang}`);}
function setLang(l){state.lang=l;const h=document.documentElement;h.lang=l;h.dir=l==='fa'?'rtl':'ltr';
 const s=(id,p,e)=>{document.getElementById(id).textContent=t(p,e)};s('demoTop','پیش‌نمایش محصول · داده نمونه','Product preview · sample data');s('addManagerLbl','افزودن مدیر','Add manager');s('footNote','کنسول تعاملی کلاود ایران · کانسپت رابط کاربری · همه داده‌ها نمونه‌اند و هیچ درخواست یا پرداختی انجام نمی‌شود.','ClaudeIran interactive console · UI concept · all data is sample; no request or payment is made.');s('backLink','بازگشت به وب‌سایت ↗','Back to website ↗');
 document.getElementById('langToggle').textContent=fa()?'EN':'فا';document.getElementById('bellBtn').setAttribute('aria-label',t('اعلان‌ها','Notifications'));render()}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),3000)}
function exportCSV(){let c,r;const v=state.view;if(v==='projects'){c=['Project','Model','Keys','Budget','Spent','Status'];r=projects().map(p=>[p.en,p.model,p.key,p.budget,p.spent,p.status])}else if(v==='keys'){c=['Name','Masked key','Project','Created','Status'];r=[...state.keysExtra,...keyData].map(k=>[k.name,k.tail,projectData[k.project].en,k.created,state.keysRevoked.has(k.id)?'paused':k.status])}else if(v==='requests'){c=['ID','Project','Model','Tokens in','Tokens out','Cost','Status'];r=requestData.map(x=>[x.id,projectData[x.project].en,x.model,x.tin,x.tout,x.cost,x.status])}else{c=['Transaction','Description','Amount','Date','Status'];r=transactions.map(x=>[x.id,x.nameEn,x.amount,x.date,x.status])}
 const csv=[c,...r].map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`claudeiran-${v}-demo.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}

document.addEventListener('click',e=>{const T=s=>e.target.closest(s);let el;
 if(el=T('[data-go]')){go(el.dataset.go);document.getElementById('view').focus({preventScroll:true});return}
 if(el=T('[data-period]')){state.period=+el.dataset.period;render();return}
 if(el=T('[data-filter]')){state.filter=el.dataset.filter;state.page=1;render();return}
 if(el=T('[data-sort]')){const k=el.dataset.sort;state.sort=state.sort.k===k?{k,dir:-state.sort.dir}:{k,dir:1};render();const b=document.querySelector(`[data-sort="${k}"]`);b&&b.focus();return}
 if(el=T('[data-page]')){if(el.disabled)return;state.page=+el.dataset.page;render();return}
 if(T('[data-clear]')){state.query='';state.filter='all';state.page=1;render();return}
 if(T('[data-retry]')){state.demo='';render();toast(t('داده‌های نمونه دوباره بارگذاری شد.','Sample data reloaded.'));return}
 if(el=T('[data-req]')){reqModal(el.dataset.req);return}
 if(el=T('[data-modal]')){el.dataset.modal==='key'?keyModal():projectModal();return}
 if(el=T('[data-revoke]')){state.keysRevoked.add(el.dataset.revoke);render();toast(t('کلید نمایشی غیرفعال شد.','Demo key revoked.'));return}
 if(el=T('[data-toggle]')){const k=el.dataset.toggle;state.settings[k]=!state.settings[k];el.setAttribute('aria-checked',String(state.settings[k]));return}
 if(el=T('[data-toast]')){toast(el.dataset.toast);return}
 if(T('[data-csv]')){exportCSV();return}
 if(T('[data-close]')||T('#dlgClose')||T('#scrim')){closeModal();return}
 if(T('#copySecret')){const s=document.getElementById('secret').textContent;(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast(t('کلید نمونه کپی شد.','Sample key copied.')),()=>toast(t('متن را دستی انتخاب کنید.','Select the text to copy.')));return}
 if(T('#bellBtn')){go('overview');toast(t('هشدارها در نمای کلی هستند.','Alerts are on the overview.'));return}
 if(T('#addManager')){toast(t('افزودن مدیر در این پیش‌نمایش غیرفعال است.','Adding managers is disabled in this preview.'));return}
 if(T('#langToggle')){setLang(fa()?'en':'fa');history.replaceState(null,'',`console.html?view=${state.view}&lang=${state.lang}`);return}
});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='projForm'){const n=document.getElementById('pName').value.trim()||t('پروژه نمونه','Sample project');state.projectsExtra.unshift({fa:n,en:n,model:document.getElementById('pModel').value,key:0,budget:document.getElementById('pBudget').value||'0',spent:'0',status:'active',id:'proj_demo_'+(state.projectsExtra.length+1),req:0});closeModal();go('projects');toast(t('پروژه نمونه اضافه شد؛ چیزی ذخیره نشد.','Sample project added; nothing was saved.'))}
 if(e.target.id==='keyForm'){const name=document.getElementById('kName').value.trim()||'Demo key',pi=+document.getElementById('kProj').value;const hex=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');const secret='ci-demo-'+hex;state.keysExtra.unshift({id:'key_demo_'+hex.slice(-4),name,project:pi,tail:'•••• '+hex.slice(-4),created:'2026-11-23',lastFa:'هرگز',lastEn:'Never',status:'active'});keyShown(name,secret);if(state.view==='keys')render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){const pos=e.target.selectionStart;state.query=e.target.value;state.page=1;render();const i=document.getElementById('q');i.focus();i.setSelectionRange(pos,pos)}if(e.target.id==='budgetRange'){state.budget=+e.target.value;render();document.getElementById('budgetRange').focus()}});
document.addEventListener('keydown',e=>{const m=document.getElementById('modal');if(!m.classList.contains('open')){
  if(e.target.classList&&e.target.classList.contains('tab')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){const tabs=[...document.querySelectorAll('.tab')];let i=tabs.indexOf(e.target);i=(i+((e.key==='ArrowLeft')===fa()?1:-1)+tabs.length)%tabs.length;go(tabs[i].dataset.go);document.querySelectorAll('.tab')[i].focus()}return}
 if(e.key==='Escape')closeModal();
 if(e.key==='Tab'){const f=[...m.querySelectorAll('.dialog button,.dialog input,.dialog select')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});

/* ---- boot (URL params for previews: view, lang, request, modal=key|project|keyshown, q, filter, demo=loading|error, static) ---- */

if(Q.get('q'))state.query=Q.get('q');if(Q.get('filter'))state.filter=Q.get('filter');

if(Q.get('request'))reqModal(Q.get('request'));
if(Q.get('modal')==='key')keyModal();if(Q.get('modal')==='project')projectModal();

})();
